# ────────────────────────────────────────────────────────────────────────────────
# Android CI — Fast local Gradle build (runs on GitHub runners, not expo.dev)
# Provides rapid feedback on every commit and PR without consuming EAS build credits.
# Builds a debug APK and uploads it as a downloadable artifact.
#
# Required GitHub Secrets (Settings → Secrets and variables → Actions):
#   ORG_GRADLE_PROJECT_XAI_API_KEY          — xAI / Grok API key
#   ORG_GRADLE_PROJECT_ELEVENLABS_API_KEY   — ElevenLabs TTS key
#   ORG_GRADLE_PROJECT_OPENROUTER_API_KEY   — OpenRouter LLM key
#   ORG_GRADLE_PROJECT_VLLM_BASE_URL        — vLLM server URL (can be placeholder)
#   ORG_GRADLE_PROJECT_FISH_SPEECH_BASE_URL — Fish Speech TTS URL (can be placeholder)
#
# Gradle picks up ORG_GRADLE_PROJECT_* env vars automatically.
# No secret values ever appear in logs or artifacts.
# ────────────────────────────────────────────────────────────────────────────────
name: Android CI

on:
  push:
    branches:
      - main
      - "claude/**"
    paths:
      - "app/**"
      - "*.gradle.kts"
      - "gradle/**"
      - "gradle.properties"
      - ".github/workflows/android-ci.yml"
  pull_request:
    branches:
      - main

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
          cache: "gradle"

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Grant Gradle execute permission
        run: chmod +x ./gradlew

      - name: Build debug APK
        # Secrets injected as ORG_GRADLE_PROJECT_* env vars.
        # Gradle's project.findProperty() reads these without any extra config.
        # Values are masked in logs by GitHub Actions automatically.
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace
        env:
          ORG_GRADLE_PROJECT_XAI_API_KEY:          ${{ secrets.ORG_GRADLE_PROJECT_XAI_API_KEY }}
          ORG_GRADLE_PROJECT_ELEVENLABS_API_KEY:   ${{ secrets.ORG_GRADLE_PROJECT_ELEVENLABS_API_KEY }}
          ORG_GRADLE_PROJECT_OPENROUTER_API_KEY:   ${{ secrets.ORG_GRADLE_PROJECT_OPENROUTER_API_KEY }}
          ORG_GRADLE_PROJECT_VLLM_BASE_URL:        ${{ secrets.ORG_GRADLE_PROJECT_VLLM_BASE_URL }}
          ORG_GRADLE_PROJECT_FISH_SPEECH_BASE_URL: ${{ secrets.ORG_GRADLE_PROJECT_FISH_SPEECH_BASE_URL }}

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
          if-no-files-found: error

      - name: Report APK size
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          SIZE=$(du -sh "$APK" | cut -f1)
          echo "### APK Build Successful" >> "$GITHUB_STEP_SUMMARY"
          echo "| Field | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| File | app-debug.apk |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Size | $SIZE |" >> "$GITHUB_STEP_SUMMARY"
          echo "| SHA | ${{ github.sha }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Branch | ${{ github.ref_name }} |" >> "$GITHUB_STEP_SUMMARY"

  # ── Release build (signed) — runs on push to main only ───────────────────────
  build-release:
    name: Build signed release APK
    runs-on: ubuntu-latest
    needs: build-debug
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
          cache: "gradle"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Grant Gradle execute permission
        run: chmod +x ./gradlew

      - name: Decode Android keystore
        # ANDROID_KEYSTORE_BASE64: base64-encode your .jks file and store as GitHub Secret.
        # Run locally: base64 -i your-release-key.jks | pbcopy  (macOS)
        # Then add the output as the ANDROID_KEYSTORE_BASE64 GitHub Secret.
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > /tmp/release.jks
          chmod 600 /tmp/release.jks

      - name: Build signed release APK
        run: |
          ./gradlew :app:assembleRelease \
            -Pandroid.injected.signing.store.file=/tmp/release.jks \
            -Pandroid.injected.signing.store.password="$ANDROID_KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$ANDROID_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$ANDROID_KEY_PASSWORD" \
            --no-daemon
        env:
          ORG_GRADLE_PROJECT_XAI_API_KEY:          ${{ secrets.ORG_GRADLE_PROJECT_XAI_API_KEY }}
          ORG_GRADLE_PROJECT_ELEVENLABS_API_KEY:   ${{ secrets.ORG_GRADLE_PROJECT_ELEVENLABS_API_KEY }}
          ORG_GRADLE_PROJECT_OPENROUTER_API_KEY:   ${{ secrets.ORG_GRADLE_PROJECT_OPENROUTER_API_KEY }}
          ORG_GRADLE_PROJECT_VLLM_BASE_URL:        ${{ secrets.ORG_GRADLE_PROJECT_VLLM_BASE_URL }}
          ORG_GRADLE_PROJECT_FISH_SPEECH_BASE_URL: ${{ secrets.ORG_GRADLE_PROJECT_FISH_SPEECH_BASE_URL }}
          ANDROID_KEYSTORE_PASSWORD:               ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS:                       ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD:                    ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Cleanup keystore
        if: always()
        run: shred -u /tmp/release.jks 2>/dev/null || rm -f /tmp/release.jks

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-${{ github.sha }}
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 30
          if-no-files-found: error
